<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد اسماء قنوات يوتيوب</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#0f0f0f;color:#fff;padding:20px;text-align:center}h1{color:#ff0000}input,select{width:100%;max-width:400px;padding:14px;border-radius:12px;border:none;margin:8px 0;font-size:16px}button{background:#ff0000;color:#fff;border:none;padding:15px 30px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;max-width:400px}button:active{transform:scale(.97)}.box{background:#1f1f1f;padding:15px;border-radius:12px;margin:10px auto;max-width:400px;display:flex;justify-content:space-between;align-items:center}.copy{background:#333;padding:8px 14px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<h1>🎬 مولد اسماء يوتيوب</h1>
<p>اكتب كلمة، واختر نوع القناة</p>
<input id="word" placeholder="مثال: gaming , طبخ , كرة قدم" value="gaming">
<select id="type">
<option value="cool">اسماء كول</option>
<option value="pro">اسماء احترافية</option>
<option value="funny">اسماء مضحكة</option>
</select>
<br><button onclick="generate()">توليد اسماء 🔥</button>
<div id="result"></div>
<script>
function generate(){
let w=document.getElementById('word').value.trim()||'gaming';
let t=document.getElementById('type').value;
let pre={cool:['x','Mr','Real','Top','Pro','Elite','King'],pro:['Official','TV','Channel','Studio','Hub','Zone','World'],funny:['Funny','Crazy','Lol','Meme','Bala','Shabab']};
let suf={cool:['Gaming','YT','Play','Zone','Army','Legends'],pro:['','Gaming','HD','Live','Plus'],funny:['TV','Show','Comedy','Bros','Gang']};
let p=pre[t];let s=suf[t];let out='';
for(let i=0;i<8;i++){
let name=p[Math.floor(Math.random()*p.length)]+w.charAt(0).toUpperCase()+w.slice(1)+s[Math.floor(Math.random()*s.length)]+Math.floor(Math.random()*99);
out+=`<div class="box"><span>${name}</span><span class="copy" onclick="navigator.clipboard.writeText('${name}');alert('تم النسخ')">نسخ</span></div>`;
}
document.getElementById('result').innerHTML=out;
}
generate();
</script>
</body>
</html>
